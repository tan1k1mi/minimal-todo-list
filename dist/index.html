<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Простой список задач, который сохраняется в браузере." />
    <meta name="theme-color" content="#f7f7f5" />
    <title>Мои задачи</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Навигация">
        <div class="brand" aria-label="Мои задачи">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="m7 12 3 3 7-7" /></svg>
          </span>
          <span>Мои задачи</span>
        </div>

        <nav aria-label="Разделы задач">
          <button class="nav-item active" type="button" data-view="today" aria-current="page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h10" /></svg>
            <span>Сегодня</span>
            <span class="nav-count" id="today-count">0</span>
          </button>
          <button class="nav-item" type="button" data-view="upcoming">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v3m12-3v3M4.5 9h15M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z" /></svg>
            <span>Предстоящие</span>
            <span class="nav-count" id="upcoming-count">0</span>
          </button>
        </nav>

        <p class="storage-note">Задачи сохраняются<br />в этом браузере</p>
      </aside>

      <main class="main-content">
        <section class="task-view" aria-labelledby="page-title">
        <header class="app-header">
          <div>
            <h1 id="page-title">Сегодня</h1>
            <p class="subtitle" id="page-subtitle">Сосредоточьтесь на главном</p>
          </div>
          <p class="task-count" id="task-count" aria-live="polite">0 задач</p>
        </header>

        <form class="task-form" id="task-form">
          <label class="sr-only" for="task-input">Новая задача</label>
          <input
            id="task-input"
            name="task"
            type="text"
            placeholder="Что нужно сделать?"
            maxlength="160"
            autocomplete="off"
            required
          />
          <fieldset class="day-picker-wrap">
            <legend class="sr-only">Выберите день</legend>
            <div class="day-picker" id="day-picker"></div>
          </fieldset>
          <input id="task-date" name="date" type="hidden" />
          <button type="submit">Добавить</button>
        </form>

        <div class="task-list-wrap">
          <div id="task-groups" aria-label="Задачи"></div>
          <div class="empty-state" id="empty-state">
            <span class="empty-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img">
                <path d="M9 11.2 11 13l4.5-4.5M5 4.5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-13a1 1 0 0 1 1-1Z" />
              </svg>
            </span>
            <h2>Все дела сделаны</h2>
            <p>Добавьте задачу, чтобы ничего не забыть.</p>
          </div>
        </div>
        </section>
      </main>
    </div>
  </body>
</html>
